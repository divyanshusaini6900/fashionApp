name: RatNawnAI_app
description: A modern Flutter app for RatNawnAI fashion transformation videos

publish_to: 'none'

version: 1.0.0+11

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # UI & Design
  cupertino_icons: ^1.0.6
  google_fonts: ^6.2.1
  shimmer: ^3.0.0
  flutter_staggered_grid_view: ^0.7.0
  cached_network_image: ^3.3.1
  image_picker: ^1.2.0
  gal: ^2.3.0
  
  # Navigation
  go_router: ^16.1.0
  
  # Firebase - Upgrade to resolve dependency constraints with fluttertoast/web
  firebase_core: ^4.0.0
  firebase_auth: ^6.0.0
  firebase_storage: ^13.0.0
  cloud_firestore: ^6.0.0
  firebase_app_check: ^0.4.0
  cloud_functions: ^6.0.1
  
  # File Management
  path_provider: ^2.1.3
  permission_handler: ^12.0.1

  dio: ^5.8.0+1
  device_info_plus: ^11.5.0
  url_launcher: ^6.2.6
  
  # Location and City Services
  geolocator: ^13.0.1
  geocoding: ^3.0.0
  http: ^1.2.0
  
  # State Management
  flutter_bloc: ^9.1.1
  equatable: ^2.0.5
  provider: ^6.1.2
  
  # HTTP client (using Dio)
  http_parser: ^4.0.2
  razorpay_flutter: ^1.3.7
  
  # Utils
  intl: ^0.20.2
  uuid: ^4.5.1
  flutter_local_notifications: ^19.4.0
  
  # Background processing - UPDATED VERSION
  flutter_background_service: ^5.0.10  # Re-enabled with API 35 compatibility
  flutter_background_service_android: ^6.2.6
  flutter_background_service_ios: ^5.0.1
  workmanager: ^0.9.0  # Latest stable version
  
  # OTP and Phone Authentication
  pinput: ^5.0.1
  fluttertoast: ^8.2.12
  connectivity_plus: ^6.1.5
  smooth_page_indicator: ^1.1.0

  #video_player:
  chewie: ^1.7.4
  video_player: ^2.8.1

  saver_gallery: ^3.0.6

dependency_overrides:
  fluttertoast: ^8.2.12

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.1
  flutter_launcher_icons: ^0.13.1


flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/1024.png"
  min_sdk_android: 19
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "assets/images/1024.png"


flutter_native_splash:
  color: "#ffffff"
  image: "assets/images/techrelieve_logo.png.png"
  android_gravity: center
  ios_content_mode: center
  fullscreen: true
  android: true
  ios: true
  web: false

  android_12:
    color: "#ffffff"
    image: "assets/images/1024.png"


flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/splash/  # Added for splash screen assets
    
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700